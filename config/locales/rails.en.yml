en:
  activerecord:
    errors:
      messages:
        record_invalid: 'Validation failed: %{errors}'
        restrict_dependent_destroy:
          has_one: Cannot delete record because a dependent %{record} exists
          has_many: Cannot delete record because dependent %{record} exist
        only_allows_letters: "only allows letters"
        only_allows_letters_and_numbers: "only allows letters and numbers"
  date:
    abbr_day_names:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
    abbr_month_names:
    -
    - jan
    - feb
    - mar
    - apr
    - may
    - jun
    - jul
    - aug
    - sep
    - oct
    - nov
    - dec
    day_names:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    formats:
      default: "%m/%d/%Y"
      long: "%B %d, %Y"
      short: "%b %d"
      tiny: "%m/%d"
      month: "%b/%Y"
      long_month: "%B/%Y"
      day_of_month: "%d/%m"
    month_names:
      -
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
    order:
      - :day
      - :month
      - :year
  datetime:
    distance_in_words:
      about_x_hours:
        one: about 1 hour
        other: about %{count} hours
      about_x_months:
        one: about 1 month
        other: about %{count} months
      about_x_years:
        one: about 1 year
        other: about %{count} years
      almost_x_years:
        one: almost 1 year
        other: almost %{count} years
        half_a_minute: half a minute
      less_than_x_seconds:
        one: less than 1 second
        other: less than %{count} seconds
      less_than_x_minutes:
        one: less than a minute
        other: less than %{count} minutes
      over_x_years:
        one: over 1 year
        other: over %{count} years
      x_seconds:
        one: 1 second
        other: "%{count} seconds"
      x_minutes:
        one: 1 minute
        other: "%{count} minutes"
      x_days:
        one: 1 day
        other: "%{count} days"
      x_months:
        one: 1 month
        other: "%{count} months"
      x_years:
        one: 1 year
        other: "%{count} years"
    prompts:
      second: Second
      minute: Minute
      hour: Hour
      day: Day
      month: Month
      year: Year
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: must be accepted
      blank: can't be blank
      confirmation: doesn't match %{attribute}
      empty: can't be empty
      equal_to: must be equal to %{count}
      even: must be even
      exclusion: is not available
      greater_than: must be greater than %{count}
      greater_than_or_equal_to: must be greater than or equal to %{count}
      inclusion: is not included in the list
      invalid: is invalid
      less_than: must be less than %{count}
      less_than_or_equal_to: must be less than or equal to %{count}
      model_invalid: 'Validation failed: %{errors}'
      not_a_number: is not a number
      not_an_integer: is not an integer
      odd: must be odd
      other_than: must be other than %{count}
      present: must be blank
      required: is required
      taken: has already been taken
      too_long:
        one: 'is too long (maximum: 1 character)'
        other: 'is too long (maximum: %{count} characters)'
      too_short:
        one: 'is too short (minimum: 1 character)'
        other: 'is too short (minimum: %{count} characters)'
      wrong_length:
        one: does not have the expected length (1 character)
        other: does not have the expected length (%{count} characters)
    template:
      body: 'Please check the following field(s):'
      header:
        one: 'Could not save %{model}: 1 error'
        other: 'Could not save %{model}: %{count} errors'
  helpers:
    select:
      prompt: Please select
    submit:
      create: Create %{model}
      submit: Save %{model}
      update: Update %{model}
  number:
    currency:
      format:
        delimiter: "."
        format: "%u %n"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: $
    format:
      delimiter: "."
      precision: 3
      separator: ","
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion:
            one: billion
            other: billions
          million:
            one: million
            other: millions
          quadrillion:
            one: quadrillion
            other: quadrillions
            thousand: thousand
          trillion:
            one: trillion
            other: trillions
          unit: ''
      format:
        delimiter: ''
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: Byte
            other: Bytes
          eb: EB
          gb: GB
          kb: KB
          mb: MB
          pb: PB
          tb: TB
    percentage:
      format:
        delimiter: "."
        format: "%n%"
    precision:
      format:
        delimiter: "."
  support:
    array:
      last_word_connector: " and "
      two_words_connector: " and "
      words_connector: ", "
  time:
    am: ''
    formats:
      default: "%m/%d/%Y %H:%M:%S"
      long: "%B %d, %Y at %H:%M"
      short: "%b %d, %H:%M"
      iso: "%Y-%m-%d"
      date: "%m/%d/%Y"
      month: "%b/%Y"
    pm: ''