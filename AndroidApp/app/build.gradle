plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barbermanagement.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.barbermanagement.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // URLs por ambiente — sobrescritas por buildType abaixo
        buildConfigField "String", "FRONTEND_URL", '"https://dev.barbermanagement.io"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Aponta para o ambiente de produção/staging
            buildConfigField "String", "FRONTEND_URL", '"https://dev.barbermanagement.io"'
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            // localhost:5173 funciona via `adb reverse tcp:5173 tcp:5173`
            buildConfigField "String", "FRONTEND_URL", '"http://localhost:5173"'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.8.0'
    
    // Para Appium testing
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    // Testes Java com Appium
    testImplementation 'io.appium:java-client:9.0.0'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.21.1'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.21.1'
}

