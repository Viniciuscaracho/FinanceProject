<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4535C8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Arc ~320°, gap centered at 12 o'clock, start at ~1 o'clock -->
  <circle cx="50" cy="50" r="33"
          fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="184 23"
          transform="rotate(-60 50 50)"/>
  <!-- Dot at start of arc (1 o'clock position) -->
  <circle cx="66.5" cy="21.5" r="8.5" fill="#7B57E0"/>
</svg>
