<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Viewport com suporte a zoom e diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="description" content="Sistema de gestão financeira completo para barbearias e salões" />
    <meta name="keywords" content="barbearia, gestão financeira, agendamento, controle financeiro" />
    <meta name="author" content="BarberManagement" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BarberManagement" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/favicon.ico" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    
    <!-- Google Fonts: Space Grotesk (títulos) e Inter (texto geral) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <title>BarberManagement - Controle Financeiro</title>
  </head>
  <body style="overflow-x: hidden; width: 100%; max-width: 100vw;">
    <div id="root" style="width: 100%; max-width: 100vw; overflow-x: hidden;"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Install Prompt Handler -->
    <script>
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Dispara evento customizado para o React
        window.dispatchEvent(new CustomEvent('pwa-install-available', { detail: e }));
      });
      
      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </body>
</html>
