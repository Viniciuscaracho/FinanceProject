map $http_user_agent $is_bot {
    default 0;
    "~*(googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|discordbot|slackbot|applebot|rogerbot|embedly|quora|redditbot|pinterest|chrome-lighthouse)" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml text/javascript;
    gzip_min_length 256;

    # Static assets — long cache, immutable
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Health check
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Docker DNS resolver — necessário para proxy_pass com variável (resolução lazy)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Debug temporário: testa se o prerender está alcançável (remover após validar)
    location /debug-prerender {
        set $pr "orbiproject_prerender:3000";
        proxy_pass http://$pr/https://orbinutri.com.br/;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    location ~ ^/_prerender(/?.*)$ {
        internal;
        set $prerender_upstream "orbiproject_prerender:3000";
        rewrite ^/_prerender(/?.*)$ /https://app.orbinutri.com.br$1 break;
        proxy_pass         http://$prerender_upstream;
        proxy_set_header   Host app.orbinutri.com.br;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Accept-Encoding "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_fallback;
    }

    # Fallback: se o prerender estiver down, serve o SPA normal para o bot
    location @spa_fallback {
        root /usr/share/nginx/html;
        try_files /index.html =500;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA catch-all — crawlers vão para prerender, browsers recebem index.html
    location / {
        if ($is_bot = 1) {
            rewrite ^(.*)$ /_prerender$1 last;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
