version: '3.2'
services:
  barber-management-mail:
    image: 'sj26/mailcatcher'
    ports:
      - "1080:1080"
      - "1025:1025"

  barber-management-redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  barber-management-db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "9999:5432"
    volumes:
      - "barber-management-db-data:/var/lib/postgresql/data"

  evolution-api:
    image: evoapicloud/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_TYPE=http
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@barber-management-db:5432/evolution_api
      - DATABASE_URL=postgresql://postgres:postgres@barber-management-db:5432/evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=false
      - REDIS_URI=redis://barber-management-redis:6379
      - REDIS_PREFIX_KEY=evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=orbi-evolution-local-key
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - WEBHOOK_GLOBAL_ENABLED=false
      - QRCODE_LIMIT=30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - barber-management-db
      - barber-management-redis
    volumes:
      - evolution-api-data:/evolution/instances

volumes:
  barber-management-db-data:
  evolution-api-data: